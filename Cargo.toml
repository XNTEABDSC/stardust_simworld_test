[package]
name = "stardust_simworld_test"
version = "0.1.0"
edition = "2024"

[dependencies]

bevy = {workspace=true, features=["dynamic_linking"]}

frunk = {workspace=true}
frunk_core = {workspace=true}

rand = {workspace=true}
derive_more = { workspace=true,features = ["add","add_assign","not","deref","deref_mut"]}
log = { workspace=true, features = ["max_level_debug", "release_max_level_warn"] }
dashmap = {workspace=true}
bimap = {workspace=true}

wacky_bag = {workspace=true}
wacky_bag_hlist = {workspace=true}
statistic_physics = {workspace=true}
physics_basic = {workspace=true}

simba = {workspace=true}
num-traits = {workspace=true}
nalgebra = {workspace=true}
fixed = {workspace=true}
cordic = {workspace=true}

stardust_simworld = {path="../stardust_simworld"}
wacky_bag_bevy = {path="../wacky_bag_bevy"}

bevy-inspector-egui = "0.38.0"
bevy_pancam = "0.22.0"
